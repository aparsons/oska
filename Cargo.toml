[workspace]
resolver = "2"
members = ["crates/oskac", "crates/oska-syntax", "crates/oska-check", "crates/oska-run", "crates/oska-sys"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/aparsons/oska"
rust-version = "1.77"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
