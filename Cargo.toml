[workspace]
resolver = "2"
members = ["crates/oskac", "crates/oska-syntax", "crates/oska-check", "crates/oska-run", "crates/oska-native", "crates/oska-sys", "crates/oska-eval"]

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/aparsons/oska"
rust-version = "1.89"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"

# Release builds use fat link-time optimisation and one codegen unit: a
# faster interpreter and compiler and a smaller binary, for a longer build.
# Measured in docs/research/2026-11-memcpy-replacement.md and
# docs/research/2026-11-musl-oskac-performance.md (spec #577).
[profile.release]
lto = "fat"
codegen-units = 1

# The `oskac` that is shipped, benchmarked and smoke-tested (release.yml,
# the musl job of ci.yml, bench.yml, scripts/bench-native.sh): the release
# profile, and a panic aborts instead of unwinding (3 to 24% faster on
# loops, lists and recursion, no change on the site build; section 12 of the
# musl note). `oskac` installs its own panic hook (crates/oskac/src/crash.rs):
# one line, the temporary files removed, exit code 101 as before. Build it
# with `cargo build --profile dist -p oskac`; the binary is in `target/dist/`.
# `cargo build --release` keeps unwinding, which `oska-eval` needs: it
# catches a task's panic and goes on. `cargo test` ignores `panic`.
[profile.dist]
inherits = "release"
panic = "abort"
# Not `debug = "line-tables-only"`: measured on 2026-11-25 (spec #737), it
# grew the x86_64 glibc oskac from 4.9 MB to 20.6 MB, far over the 5% limit.
# A backtrace from this profile still names functions (the symbols stay) but
# not files and lines.

# Test steps are dominated by running the interpreter and compiler these
# crates hold, so build them optimised in dev and test builds (`test`
# inherits `dev`). Debug assertions and overflow checks stay on; release
# builds are unaffected. Measured in docs/research/2026-11-development-throughput.md.
[profile.dev.package.oska-run]
opt-level = 1

[profile.dev.package.oskac]
opt-level = 1

[profile.dev.package.oska-check]
opt-level = 1

[profile.dev.package.oska-native]
opt-level = 1

# `oska-sys` holds the x86_64 musl build's `memcpy` and `memmove` (ADR 0009),
# which every test binary of that build calls. Unoptimised, they are several
# times slower than musl's own and made the musl `rest` shard time out.
[profile.dev.package.oska-sys]
opt-level = 3
