[workspace]
resolver = "2"
members = ["crates/oskac", "crates/oska-syntax", "crates/oska-check", "crates/oska-run", "crates/oska-native", "crates/oska-sys", "crates/oska-eval"]

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/aparsons/oska"
rust-version = "1.77"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"

# Release builds of `oskac` use fat link-time optimisation and one codegen
# unit: a faster interpreter and compiler and a smaller binary, for a longer
# release build. Measured in docs/research/2026-11-memcpy-replacement.md and
# docs/research/2026-11-musl-oskac-performance.md (spec #577).
#
# A panic aborts instead of unwinding (9 to 24% faster on loops, lists and
# recursion, no change on the site build; section 12 of the musl note).
# `oskac` installs its own panic hook (crates/oskac/src/crash.rs): one line,
# the temporary files removed, exit code 101 as before. `cargo test` ignores
# this setting, so tests still unwind. A release build of `oska-eval` aborts
# on a panic too, where a debug build catches it and goes on.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

# Test steps are dominated by running the interpreter and compiler these
# crates hold, so build them optimised in dev and test builds (`test`
# inherits `dev`). Debug assertions and overflow checks stay on; release
# builds are unaffected. Measured in docs/research/2026-11-development-throughput.md.
[profile.dev.package.oska-run]
opt-level = 1

[profile.dev.package.oskac]
opt-level = 1

[profile.dev.package.oska-check]
opt-level = 1

[profile.dev.package.oska-native]
opt-level = 1
