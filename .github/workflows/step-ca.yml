# The live ACME test (spec #824, #839): std.acme issues a certificate from a
# Smallstep CA on loopback by HTTP-01 and renews it. No public DNS and no
# rate limits. scripts/step-ca/run.sh starts the CA from pinned, checked
# downloads (scripts/step-ca/pin.env) and runs scripts/step-ca/live.osk.
#
# Opt-in, so a default pull request pays nothing: it runs on dispatch
#   gh workflow run step-ca.yml --ref <branch>
# and on a pull request that carries the `step-ca` label and changes std.acme,
# the test or this file. A pull request without the label reports this
# workflow as skipped. Let's Encrypt staging stays a manual check and never
# runs in CI.
#
# Needs no configuration.

name: step-ca

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
    paths:
      - crates/oska-check/src/std/acme.osk
      - crates/oska-check/src/std/jws.osk
      - crates/oska-check/src/std/x509*.osk
      - crates/oska-check/src/std/tls.osk
      - crates/oska-check/src/std/http.osk
      - scripts/step-ca/**
      - .github/workflows/step-ca.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_BACKTRACE: 1

jobs:
  live:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'step-ca')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo build --locked -p oskac
      - run: scripts/step-ca/run.sh target/debug/oskac
