# Build https://oskalang.dev with the Oska site generator and deploy it to
# GitHub Pages, then check that the live site answers.
#
# Needs, once, in the repository settings: Pages source "GitHub Actions",
# custom domain `oskalang.dev`, and HTTPS enforced once the certificate is
# issued. The `github-pages` environment that deploys use must allow `main`.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits rather than cancelling a deploy
# that is already under way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo build --release --locked -p oskac
      # The generator publishes its own authority report, as the checker
      # prints it now, at /authority.html.
      - run: ./target/release/oskac check site/build.osk > site/authority.txt
      # The API reference, as this `oskac` prints it, which the generator
      # publishes at /api/ and /api.json.
      - run: ./target/release/oskac doc --format=json > site/api.json
      - run: ./target/release/oskac run site/build.osk
      # Releases are stored in GitHub Releases (see release.yml). Fetch them
      # all, verify each against the committed key, and publish them under
      # _site/releases/<tag>/ with _site/latest.json and the key. A release
      # may carry a signed release index: the highest serial that verifies
      # is published as _site/release-index.json, and the installers are
      # then pinned to require it (stage-site.sh).
      - name: Add signed releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          releases="$RUNNER_TEMP/releases"
          mkdir -p "$releases"
          gh release list --limit 1000 --exclude-drafts --json tagName --jq '.[].tagName' |
            while IFS= read -r tag; do
              gh release download "$tag" --dir "$releases/$tag"
            done
          scripts/release/stage-site.sh "$releases" _site site/oska-release.pub
      # /.well-known/security.txt (RFC 9116), expiring a year from this
      # deploy. The generator has no clock, so it is written here.
      - run: scripts/release/security-txt.sh _site
      # Every link the site publishes must go somewhere: a page and anchor
      # on the site, or a file the repository tracks on GitHub. The checker
      # holds GitHub links against the list of tracked files.
      - run: git ls-files > site/tracked.txt
      - run: ./target/release/oskac run site/check-links.osk
      # `/.well-known/security.txt` is a hidden path. `upload-pages-artifact`
      # v3 includes hidden files; v4 and later drop them with no option to
      # keep them, so security.txt would silently not be deployed. Stay on
      # v3, and see `security_policy.rs`, which fails if this step would
      # drop hidden files.
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    # Its curl retries can take minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: https://oskalang.dev/ answers 200
        run: |
          status=$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' \
            --retry 6 --retry-delay 10 --retry-all-errors --fail \
            https://oskalang.dev/) || true
          echo "https://oskalang.dev/ answered ${status:-nothing}"
          test "$status" = 200
      - name: the files agents and installers fetch are published
        run: |
          for path in install.sh install.ps1 oska-release.pub llms.txt llms-full.txt llms-research.txt \
            sitemap.xml robots.txt latest.json codes.json api.json search.json agent-setup.md \
            security.md favicon.svg; do
            curl --silent --show-error --fail --location --output /dev/null \
              --retry 6 --retry-delay 10 --retry-all-errors \
              "https://oskalang.dev/$path"
            echo "https://oskalang.dev/$path answers"
          done
      # GitHub Pages serves 404.html, with status 404, for any address with
      # no page.
      - name: an unknown address gets the custom 404 page
        run: |
          status=$(curl --silent --show-error --output "$RUNNER_TEMP/not-found.html" \
            --write-out '%{http_code}' --retry 6 --retry-delay 10 \
            https://oskalang.dev/no-such-page-smoke-check) || true
          echo "an unknown address answered ${status:-nothing}"
          test "$status" = 404
          grep -q 'Page not found' "$RUNNER_TEMP/not-found.html"
      # A missing, incomplete or expired security.txt fails the deploy.
      - name: security.txt is published and has not expired
        run: scripts/release/check-security-txt.sh https://oskalang.dev
      # Once a release is published, install it the way the guide says and
      # run it. With no release yet, this passes with a warning annotation.
      - name: the published one-line install works
        run: scripts/release/smoke-published.sh https://oskalang.dev
