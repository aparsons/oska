# Build, sign and publish oskac releases.
#
# Pushing a tag vX.Y.Z (the version oskac reports, from Cargo.toml):
#   1. builds oskac natively for Linux, macOS (x86_64, aarch64) and Windows
#      (x86_64). Linux has two builds per processor (ADR 0022): the glibc
#      build, oskac-linux-<arch>-gnu, on Ubuntu 22.04, so it needs glibc
#      2.35 or newer; and the musl build, oskac-linux-<arch>-musl, from
#      the <arch>-unknown-linux-musl target, static, so it runs on any
#      Linux. scripts/release/check-linux-build.sh checks each;
#   2. assembles the binaries and SHA256SUMS, whose first line names the
#      tag (`# oska-release vX.Y.Z`). It also builds the container image
#      from the two musl builds (scripts/release/image.sh, reproducible OCI
#      bytes, SOURCE_DATE_EPOCH the commit's time) and lists the digest of
#      its image index, oskac-image-digest, in SHA256SUMS, so the release
#      signature covers the image. It lists the SPDX SBOM too
#      (oskac.spdx.json, scripts/release/sbom.sh, from the tag's
#      Cargo.lock), so the signature covers that. It writes the release notes, the
#      version's CHANGELOG.md section and a footer (scripts/release/notes.sh),
#      and fails if the version has none. smoke-image then runs both musl
#      builds in alpine and in that image, on x86_64 and aarch64;
#   3. signs SHA256SUMS with the RELEASE_SIGNING_KEY secret
#      (`ssh-keygen -Y sign -n oska-release`) and verifies the result against
#      site/oska-release.pub; then, with the same key, signs the next
#      release index (scripts/release/sign-index.sh, namespace oska-index):
#      the serial after the one https://oskalang.dev publishes, naming the
#      newest stable release, expiring in 90 days;
#   4. pushes the image assemble built to ghcr.io/aparsons/oskac by digest
#      only (scripts/release/push-image.sh digest: it verifies the signed
#      release, refuses a layout that is not the signed digest, pushes by
#      digest and reads it back; any mismatch fails the release);
#   5. stores the files, and the index beside them, in a GitHub Release
#      whose body is those notes.
#      Users install from oskalang.dev, whose installers verify the
#      signatures; the GitHub Release is the source the Pages workflow
#      fetches from;
#   6. starts the Pages workflow on main, which fetches every release,
#      verifies it again and publishes it at
#      https://oskalang.dev/releases/vX.Y.Z/ with /latest.json, and
#      publishes the highest-serial index as /release-index.json;
#   7. only then, in the tag-image job, tags the image vX.Y.Z, and latest
#      when the signed release index names this release
#      (push-image.sh tags), each read back, so no public tag names a
#      release that was not published. Only publish and tag-image have
#      `packages: write`, and they use the workflow's own token.
#
# A pull request is a dry run: the same builds and the same image smoke
# test, signed with a throwaway key, verified and staged into a scratch
# site. Nothing is published or pushed, and it never enters the `release`
# environment.
#
# Needs, once:
#   - the secret RELEASE_SIGNING_KEY, an OpenSSH private key with no
#     passphrase, whose public half is committed as site/oska-release.pub;
#   - so that only a maintainer's tag can sign: the jobs that read the key or
#     publish (`sign`, `publish`, `tag-image`) run in the environment `release`.
#     Configure it in the repository settings:
#       * Environments > `release` > Deployment branches and tags: "Selected
#         branches and tags", with the tag rule `v*` and the branch rule
#         `main`, which only resign-index.yml's monthly re-sign needs;
#       * the secret RELEASE_SIGNING_KEY stored in the `release` environment,
#         and the repository-level secret of that name deleted;
#       * Rules > Rulesets: a tag ruleset targeting `v*` that restricts
#         creations, updates and deletions, with only maintainers (repository
#         admins) on the bypass list;
#       * optionally, required reviewers on the environment.
#     Until then the workflow still works: GitHub creates the environment
#     unprotected on first use, and repository secrets reach it.
#   - the first push creates the package ghcr.io/aparsons/oskac, private;
#     make it public once in its package settings (docs/agents/release.md).
#
# The release scripts are in scripts/release/ and are tested by
# scripts/release/test.sh.

name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - scripts/release/**
      - .github/workflows/release.yml

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The glibc builds run on the oldest supported Ubuntu, so they
          # need only its glibc (2.35); install.sh takes them only there.
          - asset: oskac-linux-x86_64-gnu
            runner: ubuntu-22.04
            machine: x86_64
            linux: gnu
          - asset: oskac-linux-aarch64-gnu
            runner: ubuntu-22.04-arm
            machine: aarch64
            linux: gnu
          # The musl builds are static: no dynamic loader, no shared
          # library, so they run on any Linux. Built natively too, with
          # the musl target of the pinned Rust.
          - asset: oskac-linux-x86_64-musl
            runner: ubuntu-22.04
            machine: x86_64
            linux: musl
            target: x86_64-unknown-linux-musl
          - asset: oskac-linux-aarch64-musl
            runner: ubuntu-22.04-arm
            machine: aarch64
            linux: musl
            target: aarch64-unknown-linux-musl
          - asset: oskac-macos-x86_64
            runner: macos-15-intel
            machine: x86_64
          - asset: oskac-macos-aarch64
            runner: macos-latest
            machine: arm64
          - asset: oskac-windows-x86_64.exe
            runner: windows-latest
            machine: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # Per job, not in rust-toolchain.toml, so clones do not download it.
      - name: Add the musl target
        if: matrix.target != ''
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"
      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --profile dist --locked -p oskac ${TARGET:+--target "$TARGET"}
      - name: Name the binary for its target
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
          MACHINE: ${{ matrix.machine }}
          LINUX_BUILD: ${{ matrix.linux }}
          TARGET: ${{ matrix.target }}
        run: |
          # A runner label that moves to other hardware must fail the build,
          # not ship a binary under the wrong name.
          test "$(uname -m)" = "$MACHINE"
          if [ "$RUNNER_OS" = Windows ]; then
            bin=target/dist/oskac.exe
          elif [ -n "$TARGET" ]; then
            bin=target/$TARGET/dist/oskac
          else
            bin=target/dist/oskac
          fi
          mkdir dist
          cp "$bin" "dist/$ASSET"
          "dist/$ASSET" --version
          if [ "$RUNNER_OS" = Linux ]; then
            # gnu: no glibc symbol newer than the 2.35 the install guide
            # and install.sh promise. musl: no PT_INTERP and no DT_NEEDED,
            # so it runs with no C library.
            scripts/release/check-linux-build.sh "$LINUX_BUILD" "dist/$ASSET"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  assemble:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: builds
          pattern: oskac-*
          merge-multiple: true
      - name: Name the release
        id: tag
        run: |
          chmod +x builds/oskac-linux-x86_64-gnu
          built=$(builds/oskac-linux-x86_64-gnu --version)
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag=$GITHUB_REF_NAME
            if [ "$built" != "oskac ${tag#v}" ]; then
              echo "::error::tag $tag does not match '$built'; bump the version in Cargo.toml"
              exit 1
            fi
          else
            tag="v${built#oskac }"
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
      - name: Assemble, with the image built from the musl builds
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # The time stamped into the image: the tag's commit time, so a
          # reviewer can rebuild it (docs/agents/release.md).
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct HEAD)
          export SOURCE_DATE_EPOCH
          scripts/release/assemble.sh "$TAG" builds release "$RUNNER_TEMP/image"
          echo "image index: $(cat "release/$TAG/oskac-image-digest")"
      # The SBOM is in SHA256SUMS, so the signature covers it. Check, on
      # every event and before anything is signed, that it is SPDX 2.3 for
      # this tag, lists every package of Cargo.lock and describes oskac.
      - name: Check the SBOM
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          sbom="release/$TAG/oskac.spdx.json"
          grep -qE '^[0-9a-f]{64}  oskac\.spdx\.json$' "release/$TAG/SHA256SUMS"
          packages=$(grep -c '^\[\[package\]\]' Cargo.lock)
          jq -e --arg tag "$TAG" --argjson packages "$packages" '
            .spdxVersion == "SPDX-2.3"
            and .documentNamespace == "https://oskalang.dev/releases/\($tag)/oskac.spdx.json"
            and (.packages | length) == $packages
            and (.documentDescribes | length) == 1
            and ([.packages[] | select(.name == "oskac")] | length) == 1' "$sbom"
          jq '{name, created: .creationInfo.created, packages: (.packages | length)}' "$sbom"
      # The GitHub Release's body: the version's CHANGELOG.md section and a
      # footer (scripts/release/notes.sh). On every event, before anything
      # is signed, so a version with no section fails the pull request's
      # dry run and stops a tag before sign. Beside release/<tag>/, not in
      # it: SHA256SUMS does not list it and publish does not upload it.
      - name: Write the release notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          scripts/release/notes.sh "$TAG" CHANGELOG.md site/oska-release.pub \
            "release/$TAG/oskac-image-digest" >release/release-notes.md
          cat release/release-notes.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-layout
          path: ${{ runner.temp }}/image/
          if-no-files-found: error
          retention-days: 7
      - name: Sign and verify with a throwaway key (dry run)
        if: github.event_name == 'pull_request'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          dry="$RUNNER_TEMP/dry-run"
          mkdir "$dry"
          cp -R release/. "$dry/"
          key="$RUNNER_TEMP/dry-run-key"
          ssh-keygen -q -t ed25519 -N '' -C oska-release-dry-run -f "$key"
          scripts/release/sign.sh "$dry/$TAG" "$key" "$key.pub"
          printf 'oska-release namespaces="oska-release" %s\n' "$(cat "$key.pub")" \
            >"$RUNNER_TEMP/allowed_signers"
          ssh-keygen -Y verify -f "$RUNNER_TEMP/allowed_signers" -I oska-release \
            -n oska-release -s "$dry/$TAG/SHA256SUMS.sig" <"$dry/$TAG/SHA256SUMS"
          # As if no index were published yet: the live one is signed by
          # the real key, which this run never sees.
          scripts/release/sign-index.sh --tag "$TAG" "$key" "$key.pub" \
            "file://$RUNNER_TEMP/no-site" "$dry/$TAG"
          # The Oska verifier, built with this run's oskac and the throwaway
          # key in place of the pinned release key (a copy; verify.osk is
          # not edited). Any failure stops the step.
          scripts/release/build-verifier.sh "$PWD/builds/oskac-linux-x86_64-gnu" \
            "$key.pub" "$RUNNER_TEMP/verify-release"
          export OSKA_VERIFY="$RUNNER_TEMP/verify-release"
          mkdir "$RUNNER_TEMP/site"
          scripts/release/stage-site.sh "$dry" "$RUNNER_TEMP/site" "$key.pub"
          find "$RUNNER_TEMP/site" -type f | sort
          for f in latest.json release-index.json; do
            if [ -f "$RUNNER_TEMP/site/$f" ]; then
              jq . "$RUNNER_TEMP/site/$f"
            fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'push'
        with:
          name: unsigned-${{ steps.tag.outputs.tag }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  # Both musl builds on an empty root, before anything is signed: in alpine
  # (musl, no glibc) and in the image itself, on each processor. Ubuntu
  # 24.04, not 22.04: 22.04's skopeo (1.4) cannot load an image into the
  # runner's Docker ("read/write on closed pipe"). This job builds nothing,
  # so the glibc floor of the build rows does not apply.
  smoke-image:
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        include:
          - binary: oskac-linux-x86_64-musl
            runner: ubuntu-24.04
            machine: x86_64
          - binary: oskac-linux-aarch64-musl
            runner: ubuntu-24.04-arm
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ matrix.binary }}
          path: musl
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: image-layout
          path: image
      # The runner's own skopeo; smoke-image.sh fails if there is none.
      - run: skopeo --version
      - name: Run oskac in alpine and in the image
        env:
          BINARY: ${{ matrix.binary }}
          MACHINE: ${{ matrix.machine }}
        run: |
          test "$(uname -m)" = "$MACHINE"
          scripts/release/smoke-image.sh "musl/$BINARY" image examples/hello.osk

  # The only job that reads the signing key. The `release` environment
  # limits it to v* tags once configured (see the top of this file).
  sign:
    needs: [assemble, smoke-image]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    outputs:
      tag: ${{ needs.assemble.outputs.tag }}
    env:
      TAG: ${{ needs.assemble.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-${{ needs.assemble.outputs.tag }}
          path: release
      - name: Sign with the release key
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::the RELEASE_SIGNING_KEY secret is not set"
            exit 1
          fi
          if [ ! -f site/oska-release.pub ]; then
            echo "::error::site/oska-release.pub is not committed"
            exit 1
          fi
          key="$RUNNER_TEMP/release-key"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$RELEASE_SIGNING_KEY" >"$key")
          scripts/release/sign.sh "release/$TAG" "$key" site/oska-release.pub
          # After sign.sh, whose check allows no file SHA256SUMS does not
          # list. stage-site.sh takes the index out of the release again.
          scripts/release/sign-index.sh --tag "$TAG" "$key" site/oska-release.pub \
            https://oskalang.dev "release/$TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ needs.assemble.outputs.tag }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: sign
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      # Create the GitHub Release.
      contents: write
      # Start the Pages workflow.
      actions: write
      # Push the image to ghcr.io/aparsons/oskac. No other job has it.
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.sign.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ needs.sign.outputs.tag }}
          path: release
      # The OCI bytes assemble wrote; push-image.sh pushes them only if
      # they are the signed digest.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: image-layout
          path: image
      # Before the GitHub Release, by digest only: push-image.sh verifies
      # the signed release, checks that the layout is the signed digest,
      # pushes it by digest and reads it back. No public tag names it yet,
      # so a release that fails from here on leaves no tag behind; the
      # tag-image job tags it once the GitHub Release exists. The runner's
      # own skopeo, never one installed here: this job holds write tokens.
      # push-image.sh fails if there is none.
      - name: Push the signed image by digest
        run: |
          export REGISTRY_AUTH_FILE="$RUNNER_TEMP/registry-auth.json"
          trap 'rm -f "$REGISTRY_AUTH_FILE"' EXIT
          printf '%s' "$GH_TOKEN" |
            skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          scripts/release/push-image.sh digest "release/$TAG" site/oska-release.pub image ghcr.io/aparsons/oskac
      - name: Store the files in a GitHub Release
        run: |
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          # The body assemble wrote, as a file: never on a command line.
          # Set once, here; no workflow rewrites it.
          gh release create "$TAG" --verify-tag "${prerelease[@]}" \
            --title "oskac $TAG" \
            --notes-file release/release-notes.md \
            release/"$TAG"/*
      # Events caused by GITHUB_TOKEN start no workflows, except a dispatch.
      - name: Publish to oskalang.dev
        run: gh workflow run pages.yml --ref main

  # The image's public tags, vX.Y.Z and (when the signed index names this
  # release) latest, only once publish has created the GitHub Release, so
  # no tag ever names a release that was not published. Its own job, so
  # "Re-run failed jobs" retries the tags alone if they fail.
  tag-image:
    needs: [sign, publish]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      # Check out the scripts.
      contents: read
      # Tag the image in ghcr.io/aparsons/oskac. Only publish has it too.
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.sign.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ needs.sign.outputs.tag }}
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: image-layout
          path: image
      # push-image.sh checks everything again, pushes the same bytes by
      # digest and reads them back before any tag names them.
      - name: Tag the signed image
        run: |
          export REGISTRY_AUTH_FILE="$RUNNER_TEMP/registry-auth.json"
          trap 'rm -f "$REGISTRY_AUTH_FILE"' EXIT
          printf '%s' "$GH_TOKEN" |
            skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          scripts/release/push-image.sh tags "release/$TAG" site/oska-release.pub image ghcr.io/aparsons/oskac
