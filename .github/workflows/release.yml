# Build, sign and publish oskac releases.
#
# Pushing a tag vX.Y.Z (the version oskac reports, from Cargo.toml):
#   1. builds oskac natively for Linux, macOS (x86_64, aarch64) and Windows
#      (x86_64);
#   2. assembles the binaries and SHA256SUMS, signs SHA256SUMS with the
#      RELEASE_SIGNING_KEY secret (`ssh-keygen -Y sign -n oska-release`) and
#      verifies the result against site/oska-release.pub;
#   3. stores the files in a GitHub Release, which only serves as storage
#      because the repository is private;
#   4. starts the Pages workflow on main, which fetches every release,
#      verifies it again and publishes it at
#      https://oskalang.dev/releases/vX.Y.Z/ with /latest.json.
#
# A pull request is a dry run: the same builds, signed with a throwaway key,
# verified and staged into a scratch site. Nothing is published.
#
# Needs, once: the secret RELEASE_SIGNING_KEY, an OpenSSH private key with no
# passphrase, whose public half is committed as site/oska-release.pub.
#
# The release scripts are in scripts/release/ and are tested by
# scripts/release/test.sh.

name: Release

on:
  push:
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: oskac-linux-x86_64
            runner: ubuntu-latest
            machine: x86_64
          - asset: oskac-linux-aarch64
            runner: ubuntu-24.04-arm
            machine: aarch64
          - asset: oskac-macos-x86_64
            runner: macos-15-intel
            machine: x86_64
          - asset: oskac-macos-aarch64
            runner: macos-latest
            machine: arm64
          - asset: oskac-windows-x86_64.exe
            runner: windows-latest
            machine: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked -p oskac
      - name: Name the binary for its target
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
          MACHINE: ${{ matrix.machine }}
        run: |
          # A runner label that moves to other hardware must fail the build,
          # not ship a binary under the wrong name.
          test "$(uname -m)" = "$MACHINE"
          if [ "$RUNNER_OS" = Windows ]; then
            bin=target/release/oskac.exe
          else
            bin=target/release/oskac
          fi
          mkdir dist
          cp "$bin" "dist/$ASSET"
          "dist/$ASSET" --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: builds
          pattern: oskac-*
          merge-multiple: true
      - name: Name the release
        id: tag
        run: |
          chmod +x builds/oskac-linux-x86_64
          built=$(builds/oskac-linux-x86_64 --version)
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag=$GITHUB_REF_NAME
            if [ "$built" != "oskac ${tag#v}" ]; then
              echo "::error::tag $tag does not match '$built'; bump the version in Cargo.toml"
              exit 1
            fi
          else
            tag="v${built#oskac }"
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
      - name: Assemble
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: scripts/release/assemble.sh "$TAG" builds release
      - name: Sign and verify with a throwaway key (dry run)
        if: github.event_name == 'pull_request'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          key="$RUNNER_TEMP/dry-run-key"
          ssh-keygen -q -t ed25519 -N '' -C oska-release-dry-run -f "$key"
          scripts/release/sign.sh "release/$TAG" "$key" "$key.pub"
          printf 'oska-release namespaces="oska-release" %s\n' "$(cat "$key.pub")" \
            >"$RUNNER_TEMP/allowed_signers"
          ssh-keygen -Y verify -f "$RUNNER_TEMP/allowed_signers" -I oska-release \
            -n oska-release -s "release/$TAG/SHA256SUMS.sig" <"release/$TAG/SHA256SUMS"
          mkdir "$RUNNER_TEMP/site"
          scripts/release/stage-site.sh release "$RUNNER_TEMP/site" "$key.pub"
          find "$RUNNER_TEMP/site" -type f | sort
          if [ -f "$RUNNER_TEMP/site/latest.json" ]; then
            jq . "$RUNNER_TEMP/site/latest.json"
          fi
      - name: Sign with the release key
        if: github.event_name == 'push'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::the RELEASE_SIGNING_KEY secret is not set"
            exit 1
          fi
          if [ ! -f site/oska-release.pub ]; then
            echo "::error::site/oska-release.pub is not committed"
            exit 1
          fi
          key="$RUNNER_TEMP/release-key"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$RELEASE_SIGNING_KEY" >"$key")
          scripts/release/sign.sh "release/$TAG" "$key" site/oska-release.pub
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.tag.outputs.tag }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: sign
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      # Create the GitHub Release.
      contents: write
      # Start the Pages workflow.
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.sign.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.sign.outputs.tag }}
          path: release
      - name: Store the files in a GitHub Release
        run: |
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" --verify-tag "${prerelease[@]}" \
            --title "oskac $TAG" \
            --notes "Download from https://oskalang.dev/releases/$TAG/" \
            release/"$TAG"/*
      # Events caused by GITHUB_TOKEN start no workflows, except a dispatch.
      - name: Publish to oskalang.dev
        run: gh workflow run pages.yml --ref main
