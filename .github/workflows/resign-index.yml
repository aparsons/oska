# Re-sign the release index once a month, so it never lapses between
# releases.
#
# Installers refuse an index past its expiry (`stale_index`), 90 days after it
# was signed. A release run signs a new one, but releases can be months apart.
# On the 1st of each month, and when run by hand from main, this:
#   1. waits (up to 6 minutes, then fails) while a Release or Pages run is
#      under way, since either could publish an index with the serial this
#      run is about to sign;
#   2. re-signs the live index (scripts/release/sign-index.sh with no --tag)
#      with the release key: the next serial, the same `latest`, issued now
#      and expiring in 90 days. It verifies the live index first and refuses
#      to sign over one that does not verify;
#   3. attaches it to the GitHub Release it names, replacing that release's
#      index, and starts the Pages workflow, which publishes the highest
#      serial as /release-index.json.
# With no index published yet, it signs nothing: the first index comes from
# a release run.
#
# Needs, once, in the repository settings: the `release` environment admits
# the branch `main` besides the tag rule `v*`, so this unattended run can
# read RELEASE_SIGNING_KEY. Only the `sign` job reads it; see
# docs/agents/release.md.

name: Re-sign release index

on:
  schedule:
    - cron: '17 5 1 * *'
  workflow_dispatch:

permissions:
  contents: read

# Never two at once: both would sign the same serial.
concurrency:
  group: resign-index
  cancel-in-progress: false

jobs:
  # The only job that reads the signing key.
  sign:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      # List the Release and Pages runs.
      actions: read
    outputs:
      tag: ${{ steps.sign.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Wait for no Release or Pages run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # busy: names the first Release or Pages run not yet finished.
          busy() {
            local wf status n
            for wf in release.yml pages.yml; do
              for status in queued in_progress waiting pending requested; do
                n=$(gh run list --workflow "$wf" --status "$status" --json databaseId --jq length)
                if [ "$n" != 0 ]; then
                  echo "a $wf run is $status"
                  return 0
                fi
              done
            done
            return 1
          }
          # Up to 6 minutes: a Pages run after a push to main takes a few.
          for _ in $(seq 12); do
            why=$(busy) || exit 0
            echo "$why; waiting"
            sleep 30
          done
          echo "::error::$why; run this workflow again once it has finished"
          exit 1
      - name: Re-sign with the release key
        id: sign
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::the RELEASE_SIGNING_KEY secret is not set"
            exit 1
          fi
          key="$RUNNER_TEMP/release-key"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$RELEASE_SIGNING_KEY" >"$key")
          mkdir index
          scripts/release/sign-index.sh "$key" site/oska-release.pub https://oskalang.dev index
          if [ ! -f index/release-index.json ]; then
            echo "::notice::no release index is published yet; nothing to re-sign"
            exit 0
          fi
          echo "tag=$(jq -r .latest.tag index/release-index.json)" >>"$GITHUB_OUTPUT"
          jq . index/release-index.json
      - uses: actions/upload-artifact@v4
        if: steps.sign.outputs.tag != ''
        with:
          name: release-index
          path: index/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: sign
    if: github.ref == 'refs/heads/main' && needs.sign.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Replace the index on the GitHub Release.
      contents: write
      # Start the Pages workflow.
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.sign.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-index
          path: index
      - name: Attach the index to the release it names
        run: gh release upload "$TAG" index/release-index.json index/release-index.json.sig --clobber
      # Events caused by GITHUB_TOKEN start no workflows, except a dispatch.
      - name: Publish to oskalang.dev
        run: gh workflow run pages.yml --ref main
