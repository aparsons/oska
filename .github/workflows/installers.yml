# Test the one-line installers (scripts/install/) on the OS each one is for,
# against local release fixtures signed with throwaway keys. The tests check
# that an installer installs, updates in place, reports --json correctly,
# and refuses tampered binaries, checksums and signatures.
#
# Needs no secrets: every key is generated by the tests.

name: Installers

on:
  push:
    paths:
      - scripts/install/**
      - scripts/release/**
      - .github/workflows/installers.yml
  pull_request:
    paths:
      - scripts/install/**
      - scripts/release/**
      - site/oska-release.pub
      - .github/workflows/installers.yml

permissions:
  contents: read

# A pull request's newer push cancels its older runs of this workflow. Every
# other event gets a group of its own per commit, so a push to main or a branch
# is never cancelled or replaced while it waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sh:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: shellcheck scripts/install/*.sh
      - run: scripts/install/test.sh

  powershell:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Runs every test under both Windows PowerShell 5.1 and PowerShell 7.
      - shell: pwsh
        run: scripts/install/test.ps1
