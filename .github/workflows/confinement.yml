# Run the filesystem confinement tests on each OS that releases are built
# for. oska-sys copies flag, error and status values from each platform's
# headers by hand (ADR 0009), and on Windows declares ntdll's own calls,
# so its escape tests must pass on every one of them, not only on the
# Linux that ci.yml runs: symlinks, hard links and a component swapped
# during a walk everywhere, and junctions and mount points on Windows.
#
# A push runs it only on main and on the ticket and review-fix branches
# that are merged into an integration branch before any pull request, so
# a pull request's head is not tested twice.
#
# Needs no configuration.

name: Confinement

on:
  push:
    branches: [main, "ticket/**", "review-fixes-*"]
    paths:
      - crates/oska-sys/**
      - crates/oska-run/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/confinement.yml
  pull_request:
    paths:
      - crates/oska-sys/**
      - crates/oska-run/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/confinement.yml

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            machine: x86_64
          - runner: ubuntu-24.04-arm
            machine: aarch64
          - runner: macos-latest
            machine: arm64
          - runner: macos-15-intel
            machine: x86_64
          - runner: windows-latest
            machine: x86_64
    runs-on: ${{ matrix.runner }}
    # A wrong O_NONBLOCK would hang the FIFO test rather than fail it.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # A runner label that moves to other hardware must fail, not test
      # some other target under this one's name.
      - run: test "$(uname -m)" = "${{ matrix.machine }}"
        shell: bash
      - run: cargo test --locked -p oska-sys -p oska-run
