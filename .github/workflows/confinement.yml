# Run the filesystem confinement tests on each OS that releases are built
# for. oska-sys copies flag, error and status values from each platform's
# headers by hand (ADR 0009), and on Windows declares ntdll's own calls,
# so its escape tests must pass on every one of them, not only on the
# Linux that ci.yml runs: symlinks, hard links and a component swapped
# during a walk everywhere, and junctions and mount points on Windows.
#
# Linux runs on every push and pull request. macOS and Windows run only on
# main, on spec/** and on dispatch (spec #711): they wait longest for a
# runner. A pull request whose head is a pushed branch is skipped, because
# the push run of the same commit is its check.
#
# Needs no configuration.

name: Confinement

on:
  push:
    branches: [main, "spec/**", "ticket/**", "review-fixes-*"]
    paths:
      - crates/oska-sys/**
      - crates/oska-run/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/confinement.yml
  workflow_dispatch:
  pull_request:
    paths:
      - crates/oska-sys/**
      - crates/oska-run/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/confinement.yml

permissions:
  contents: read

# A pull request's newer push cancels its older runs of this workflow. Every
# other event gets a group of its own per commit, so a push to main or a branch
# is never cancelled or replaced while it waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/spec/')))) && '[{"runner":"ubuntu-latest","machine":"x86_64"},{"runner":"ubuntu-24.04-arm","machine":"aarch64"},{"runner":"macos-latest","machine":"arm64"},{"runner":"macos-15-intel","machine":"x86_64"},{"runner":"windows-latest","machine":"x86_64"}]' || '[{"runner":"ubuntu-latest","machine":"x86_64"},{"runner":"ubuntu-24.04-arm","machine":"aarch64"}]') }}
    if: github.event_name != 'pull_request' || !(startsWith(github.head_ref, 'ticket/') || startsWith(github.head_ref, 'review-fixes-') || startsWith(github.head_ref, 'spec/'))
    runs-on: ${{ matrix.runner }}
    # A wrong O_NONBLOCK would hang the FIFO test rather than fail it.
    timeout-minutes: 30
    steps:
      # Tests compare golden files and read sources byte for byte, so check
      # them out with LF, as on Linux.
      - run: git config --global core.autocrlf false
        shell: bash
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # A runner label that moves to other hardware must fail, not test
      # some other target under this one's name.
      - run: test "$(uname -m)" = "${{ matrix.machine }}"
        shell: bash
      - run: cargo test --locked -p oska-sys -p oska-run
