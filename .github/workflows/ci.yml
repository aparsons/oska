name: CI

# A push runs on main and on the ticket and review-fix branches, which are
# merged into an integration branch before any pull request, so a pull
# request's head is not tested twice (as windows.yml and confinement.yml).
on:
  push:
    branches: [main, "ticket/**", "review-fixes-*"]
  pull_request:

permissions:
  contents: read

# A pull request's newer push cancels its older runs of this workflow. Every
# other event gets a group of its own per commit, so a push to main or a branch
# is never cancelled or replaced while it waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # On arm64 and x86_64 the tests are also differential (spec #125,
    # #153): every runtime test, example, guide program, CLI fixture and
    # the site build runs as a native executable for the host too, and
    # must do what the interpreter does.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    # Incremental data about doubles the size of `target`, which is cached
    # (scripts/cargo-cache/mtimes.sh); CI builds each changed crate once.
    env:
      CARGO_INCREMENTAL: 0
      # oskac's build cache (spec #279) inside target, so it is cached with
      # the build: a test that compiles a program oskac has compiled before,
      # with the same oskac, reuses the executable. Its key holds the oskac
      # executable's hash and every input, so a compiler change misses.
      OSKA_CACHE_DIR: ${{ github.workspace }}/target/oska-cache
    # Normally 3 to 5 minutes; a hung test (once a 64 KiB pipe deadlock on
    # arm64) must turn red long before GitHub's six-hour default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      # The `target` of this job's last run on main, if any, so cargo
      # builds only what changed since. mtimes.sh gives each unchanged file
      # an old time and leaves every changed one newer than the cached
      # build, so cargo never reuses a stale one. Only main saves: a pull
      # request reads main's cache and adds none of its own, which keeps
      # the repository under GitHub's 10 GB cache limit.
      - id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: target
          key: cargo-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: cargo-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
      - run: scripts/cargo-cache/mtimes.sh
      # check.sh type-checks oskac for Windows (#323); only this job needs the
      # target, so it is not in rust-toolchain.toml (every job would download it).
      - run: rustup target add x86_64-pc-windows-gnu
      # The differential suite is compiled only where a backend runs: a
      # label that moves to other hardware must fail, not skip it.
      - if: matrix.os == 'ubuntu-24.04-arm'
        run: test "$(uname -m)" = aarch64
      - if: matrix.os == 'ubuntu-latest'
        run: test "$(uname -m)" = x86_64
      # The pinned ShellCheck check.sh's shellcheck step verifies; runner
      # images ship different releases.
      - run: scripts/shellcheck/install.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Claude Code, for check.sh's `claude plugin validate` step (spec #206):
      # its official install script, at a pinned version so the validator's
      # rules change only in a reviewed PR. It installs into ~/.local/bin,
      # already on PATH above. Without it the step fails here, never skips.
      # DISABLE_AUTOUPDATER stays set for the later steps, so check.sh runs
      # the pinned version.
      - run: |
          echo "DISABLE_AUTOUPDATER=1" >> "$GITHUB_ENV"
          curl -fsSL https://claude.ai/install.sh | DISABLE_AUTOUPDATER=1 bash -s 2.1.330
      # The pinned Lean and TLC check.sh's formal step runs (ADRs 0018,
      # 0019), checked against their pinned checksums; the runner's Java runs
      # TLC. Without them the step fails here, never skips.
      - run: |
          scripts/formal/install.sh "$HOME/.local/formal"
          echo "$HOME/.local/formal/lean/bin" >> "$GITHUB_PATH"
          echo "OSKA_TLA2TOOLS=$HOME/.local/formal/tla2tools.jar" >> "$GITHUB_ENV"
      # The same script contributors and agents run locally (and the
      # pre-push hook runs), so local and CI checks cannot drift apart.
      - run: scripts/check.sh
      # The saved list stands for the build only if no tracked file changed
      # meanwhile and every cargo step ran on the tree as checked out (CI
      # always runs them all). target/tmp holds the tests' scratch files,
      # sparse files of terabytes among them: tar would read them in full.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          scripts/cargo-cache/mtimes.sh verify
          rm -rf target/tmp
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  musl:
    # Ticket #462 of spec #461 (ADR 0022): the musl build of `oskac`, a
    # static executable with no C library at run time, must behave as the
    # glibc build does, so a change that breaks it fails here. The target is
    # added in this job, not in rust-toolchain.toml (every clone would
    # download it), and to the pinned toolchain: a Rust upgrade that breaks
    # the musl build fails this job.
    runs-on: ubuntu-latest
    # A release build, then the oska-run tests, whose interpreter runs
    # about 1.5 times slower on musl: some 15 to 25 minutes.
    timeout-minutes: 50
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: test "$(uname -m)" = x86_64
      - run: rustup target add "$TARGET"
      - run: cargo build --profile dist --locked -p oskac --target "$TARGET"
      # Static: no dynamic loader (`PT_INTERP`) and no shared library
      # (`DT_NEEDED`), so it runs on any Linux and in an empty root. The
      # release's own check, tested by check-linux-build-test.sh.
      - name: The musl build is static
        run: scripts/release/check-linux-build.sh musl "target/$TARGET/dist/oskac"
      # The confinement escape tests, the stress tests of the musl build's
      # allocator (crates/oska-sys/tests/allocator.rs, ticket #523) and the
      # interpreter, then the differential suite (the native backend
      # against the interpreter), all run by the musl build. The
      # differential suite runs this `oskac`, so its interpreter runs long
      # programs on that allocator.
      - run: cargo test --locked --target "$TARGET" -p oska-sys -p oska-run
      - run: cargo test --locked --target "$TARGET" -p oskac --test native_files --test native_parity --test native_default
      # oskac's own unit tests, among them the check that the musl build,
      # and no other, uses that allocator (crates/oskac/src/heap.rs).
      - run: cargo test --locked --target "$TARGET" -p oskac --bin oskac
      # An empty root: the binary, an empty /tmp and the example's source,
      # with no libraries and no /proc, run as a user with no other rights.
      - name: Smoke test in an empty root
        run: |
          root=$(mktemp -d)
          chmod 0755 "$root"
          install -m 0755 "target/$TARGET/dist/oskac" "$root/oskac"
          install -m 0644 examples/hello.osk "$root/hello.osk"
          mkdir -m 1777 "$root/tmp"
          # chroot(2) needs root (CAP_SYS_CHROOT); --userspec then drops to 65532.
          in_root() { sudo chroot --userspec=65532:65532 "$root" "$@"; }
          in_root /oskac --version
          test "$(in_root /oskac run /hello.osk)" = "Hello from Oska!"
          in_root /oskac build /hello.osk -o /tmp/hello
          test "$(in_root /tmp/hello)" = "Hello from Oska!"
          # Afterwards the root holds only these: no library, no /proc, and
          # nothing that `oskac run` left behind in /tmp.
          test "$(cd "$root" && find . | sort | tr '\n' ' ')" = ". ./hello.osk ./oskac ./tmp ./tmp/hello "

  macos:
    # Spec #154: on a Mac `oskac run` and `oskac test` are native by
    # default (tickets #172 and #173), so the whole of `oskac`'s tests run
    # here, on Apple silicon and on Intel: the differential suite (every
    # native_*.rs, the corpus and the site included) compares each
    # host's macOS executable with the interpreter, and `build_macos`
    # checks that macOS accepts each executable's signature (`codesign
    # --verify --strict`).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    # Incremental data about doubles the size of `target`, which is cached
    # (scripts/cargo-cache/mtimes.sh); CI builds each changed crate once.
    env:
      CARGO_INCREMENTAL: 0
      # oskac's build cache (spec #279) inside target, so it is cached with
      # the build: a test that compiles a program oskac has compiled before,
      # with the same oskac, reuses the executable. Its key holds the oskac
      # executable's hash and every input, so a compiler change misses.
      OSKA_CACHE_DIR: ${{ github.workspace }}/target/oska-cache
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # Each runner runs its own processor's executables: a label that
      # moves to the other processor must fail, not run the wrong ones.
      - run: test "$(uname -m)" = "${{ matrix.arch }}"
      # The `target` of this job's last run on main, if any, so cargo
      # builds only what changed since. mtimes.sh gives each unchanged file
      # an old time and leaves every changed one newer than the cached
      # build, so cargo never reuses a stale one. Only main saves: a pull
      # request reads main's cache and adds none of its own, which keeps
      # the repository under GitHub's 10 GB cache limit.
      - id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: target
          key: cargo-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: cargo-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
      - run: scripts/cargo-cache/mtimes.sh
      - run: cargo test -p oskac --no-fail-fast
      # The saved list stands for the build only if no tracked file changed
      # meanwhile and every cargo step ran on the tree as checked out (CI
      # always runs them all). target/tmp holds the tests' scratch files,
      # sparse files of terabytes among them: tar would read them in full.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          scripts/cargo-cache/mtimes.sh verify
          rm -rf target/tmp
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  cross-build:
    # Seam 3 of spec #153: every corpus program built for every target on
    # an aarch64 and an x86_64 Linux host, an Apple silicon and an Intel
    # Mac, and an x86_64 Windows host (#179). `cross-build-compare`
    # requires the same bytes from all five: the backend never reads the
    # host. A refusal that
    # scripts/cross-build/refused.txt does not expect fails here, with
    # oskac's error, so two hosts cannot agree by refusing.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    # A build and one compile per corpus program per target: a few minutes.
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      # The corpus is compiled as checked in: with CRLF line endings on
      # Windows its spans, and so its executables, would differ.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo build -p oskac
      - run: scripts/cross-build/manifest.sh "target/debug/oskac${{ runner.os == 'Windows' && '.exe' || '' }}" > "manifest-${{ matrix.os }}.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cross-build-${{ matrix.os }}
          path: manifest-*.txt

  cross-build-compare:
    needs: cross-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cross-build-*
          merge-multiple: true
      - run: diff manifest-ubuntu-latest.txt manifest-ubuntu-24.04-arm.txt
      - run: diff manifest-ubuntu-latest.txt manifest-macos-latest.txt
      - run: diff manifest-ubuntu-latest.txt manifest-macos-15-intel.txt
      - run: diff manifest-ubuntu-latest.txt manifest-windows-latest.txt
