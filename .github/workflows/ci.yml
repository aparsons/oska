name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A pull request's newer push cancels its older runs of this workflow. Every
# other event gets a group of its own per commit, so a push to main or a branch
# is never cancelled or replaced while it waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # On arm64 the tests are also differential (spec #125): every runtime
    # test, example, guide program, CLI fixture and the site build runs as
    # a native executable too, and must do what the interpreter does.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    # Normally 3 to 5 minutes; a hung test (once a 64 KiB pipe deadlock on
    # arm64) must turn red long before GitHub's six-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      # The differential suite is compiled only on aarch64 Linux: a label
      # that moves to other hardware must fail, not skip it.
      - if: matrix.os == 'ubuntu-24.04-arm'
        run: test "$(uname -m)" = aarch64
      # The same script contributors and agents run locally (and the
      # pre-push hook runs), so local and CI checks cannot drift apart.
      - run: scripts/check.sh
