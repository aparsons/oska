# Run the runtime and CLI tests on Windows: the FakeHost API tests, the
# RealHost tests, among them the confinement tests that walk beneath a
# handle with oska-sys's ntdll calls (ADR 0009, ADR 0014) and refuse
# reparse points, hard links, device names and alternate data streams,
# and the CLI's golden tests. ci.yml's test job runs on Ubuntu only
# (x86_64 and arm64), and the release dry run only builds.
#
# Needs no configuration.

name: Windows

on:
  push:
    branches: [main, "ticket/**", "review-fixes-*"]
    paths:
      - crates/**
      - site/**
      - docs/**
      - examples/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/windows.yml
  pull_request:
    paths:
      - crates/**
      - site/**
      - docs/**
      - examples/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/windows.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # The golden files are compared byte for byte, so check them out
      # with the LF line endings they were written with.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo test --locked --no-fail-fast -p oska-run -p oskac
