<pre># Oska

A language where `main` gets only the capabilities it declares &amp; nothing else.

```oska
fn main(io: Stdout) -&gt; Result&lt;(), IoError&gt; {
    io.println(&quot;Hello &lt;world&gt;!&quot;)?
    Ok(())
}
```
