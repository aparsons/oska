\* The bound of Channels.cfg, but channel 2 holds 2 messages. With 2
\* messages that reaches a buffer of two, which Channels.cfg cannot. TLC
\* takes about 36 s (168,369 states).
CONSTANTS
  MaxTasks = 3
  NumChannels = 2
  BufferSize = 2
  MaxMsgs = 2
  Workers = 2
  LockArms = TRUE
  CloseKeepsBuffer = TRUE
SPECIFICATION Spec
INVARIANTS
  TypeOK
  NoLostMessage
  NoDuplicateMessage
  FifoOrder
  ReceivedInOrder
  ClosedRefusesSends
  EndOnlyWhenDrained
  SelectChoosesReady
  ParkedOnlyWhileBlocked
  WithinWorkers
  DeadlockNeedsAChannel
  DeadlockIsReal
PROPERTY
  EndsOrReportsDeadlock
