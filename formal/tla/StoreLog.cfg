\* Bound: up to 3 records with 2 labels, one snapshot, one crash. TLC's
\* deadlock check is on (the default). TLC takes about 1 s (8,898 states, 2,720 distinct).
CONSTANTS
  MaxWrites = 3
  MaxLabel = 1
  AckAfterSync = TRUE
  SyncSnapshotFirst = TRUE
  VerifyChecksum = TRUE
SPECIFICATION Spec
INVARIANTS
  TypeOK
  AckedSurvive
  RecoveryIsPrefix
  ChainValid
  NoLabelDowngrade
  TruncateOnlyAfterDurableSnapshot
