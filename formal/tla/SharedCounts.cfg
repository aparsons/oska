\* Bound: 3 tasks that start out sharing one value, 3 value ids (so up to
\* 2 copies), at most 2 references per task per value, at most 2 writes.
\* TLC's deadlock check is on (the default): no step stops halfway. TLC
\* takes about 6 s.
CONSTANTS
  Tasks = {t1, t2, t3}
  Values = {1, 2, 3}
  MaxRefs = 2
  MaxWrites = 2
  Atomic = TRUE
SPECIFICATION Spec
INVARIANTS
  TypeOK
  NoUseAfterFree
  NoVisibleInPlaceChange
  CountIsReferences
