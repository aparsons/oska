\* Bound: main and 3 spawned tasks, 3 scopes, 2 workers. TLC's deadlock
\* check is on (the default). TLC takes about 50 s, most of it on the
\* temporal property.
CONSTANTS
  MaxTasks = 4
  MaxScopes = 3
  Workers = 2
  ConfineScopes = TRUE
SPECIFICATION Spec
INVARIANTS
  TypeOK
  ScopeEndsAfterItsTasks
  TaskEndsAfterItsScopes
  MainEndsLast
  SpawnOnlyIntoOpenScopes
  WithinWorkers
  NoSelfJoin
  NoWaitCycle
PROPERTY
  ProgramEnds
