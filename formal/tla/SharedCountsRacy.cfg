\* expect-violation: NoUseAfterFree
\* The bound of SharedCounts.cfg, with counts updated by a load and then a
\* separate store. TLC finds the race in about 2 s: a share and a drop of
\* the same value load the same count, the share's store is lost, and the
\* value is freed while a task still holds it.
CONSTANTS
  Tasks = {t1, t2, t3}
  Values = {1, 2, 3}
  MaxRefs = 2
  MaxWrites = 2
  Atomic = FALSE
SPECIFICATION Spec
INVARIANTS
  NoUseAfterFree
