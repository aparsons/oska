\* expect-violation: TruncateOnlyAfterDurableSnapshot
\* The bound of StoreLog.cfg, with SyncSnapshotFirst = FALSE. TLC finds the violation in a 7-state trace (the log front is dropped on an unsynced snapshot), in under 1 s.
CONSTANTS
  MaxWrites = 3
  MaxLabel = 1
  AckAfterSync = TRUE
  SyncSnapshotFirst = FALSE
  VerifyChecksum = TRUE
SPECIFICATION Spec
INVARIANTS
  TruncateOnlyAfterDurableSnapshot
