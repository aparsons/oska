\* Bound: main and 2 spawned tasks, 2 channels (a rendezvous and one with
\* room for 1 message), 2 messages, 2 workers. TLC's deadlock check is on
\* (the default). TLC takes about 38 s (172,310 states; 46 s measured on a
\* busier machine), 5 s of it on the temporal property.
CONSTANTS
  MaxTasks = 3
  NumChannels = 2
  BufferSize = 1
  MaxMsgs = 2
  Workers = 2
  LockArms = TRUE
  CloseKeepsBuffer = TRUE
SPECIFICATION Spec
INVARIANTS
  TypeOK
  NoLostMessage
  NoDuplicateMessage
  FifoOrder
  ReceivedInOrder
  ClosedRefusesSends
  EndOnlyWhenDrained
  SelectChoosesReady
  ParkedOnlyWhileBlocked
  WithinWorkers
  DeadlockNeedsAChannel
  DeadlockIsReal
PROPERTY
  EndsOrReportsDeadlock
