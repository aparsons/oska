\* Bound: main and 2 spawned tasks, 2 channels (a rendezvous and one with
\* room for 1 message), 2 messages, 2 workers. TLC's deadlock check is on
\* (the default). TLC takes about 36 s (172,310 states), 5 s of it on the
\* temporal property.
CONSTANTS
  MaxTasks = 3
  NumChannels = 2
  MaxMsgs = 2
  Workers = 2
  LockArms = TRUE
  CloseKeepsBuffer = TRUE
SPECIFICATION Spec
INVARIANTS
  TypeOK
  NoLostMessage
  NoDuplicateMessage
  FifoOrder
  ClosedRefusesSends
  EndOnlyWhenDrained
  SelectChoosesReady
  ParkedOnlyWhileBlocked
  WithinWorkers
  DeadlockNeedsAChannel
  DeadlockIsReal
PROPERTY
  EndsOrReportsDeadlock
