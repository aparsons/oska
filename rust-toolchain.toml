# One Rust for the Pi, CI and release builds. Two tables in std.rt follow
# this Rust's Unicode (`dbg`'s `escaped_table` and `lowercase_table`), and a
# newer Clippy can fail CI on code an older one passed. To upgrade, run
# `scripts/bump-rust.sh <version>`: it changes the version, regenerates both
# tables and runs scripts/check.sh (docs/agents/rust.md).
[toolchain]
channel = "1.100.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
